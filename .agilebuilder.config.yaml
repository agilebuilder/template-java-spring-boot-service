version: "1.0"
name: spring-boot-service
description: Spring Boot 3.3.x + Java 17 + Maven microservice template with layered architecture, unified response body and global exception handling
variables:
  enabled: true
  delimiter: "%"
  filePatterns:
    mode: include
    patterns:
      - "pom.xml"
      - "README.md"
      - "README.zh-CN.md"
      - "AGENTS.md"
      - "src/**/*.java"
      - "src/main/resources/application.yml"
  inquirerQuestions:
    - name: projectName
      type: input
      message: Project name
      default: demo-service
      required: true
    - name: description
      type: input
      message: Project description
      default: A Spring Boot microservice
    - name: author
      type: input
      message: Author
      default: ""
    - name: packageName
      type: input
      message: Java package name
      default: com.example.demo
    - name: javaVersion
      type: list
      message: Java version
      choices:
        - "17"
        - "21"
      default: "17"
    - name: port
      type: number
      message: Server port
      default: 8080
hooks:
  after_write:
    scriptType: shell
    script: 'git init && git add -A && git commit -m "chore: init project from template"'
    errorHandling: warn
market:
  slug: spring-boot-service
  name: Spring Boot 微服务
  summary: Spring Boot 3.3.x + Maven 的分层架构微服务模板，内置统一响应体与全局异常处理
  description: |
    基于 Spring Boot 3.3.x、Java 17+ 与 Maven 的微服务工程模板。

    - 标准分层架构：controller / service / repository / model / common
    - 内置统一响应体 ApiResponse 与全局异常处理 GlobalExceptionHandler
    - 示例健康检查端点与内存版 CRUD 接口，开箱即可运行
    - 单元测试示例（JUnit 5 + MockMvc）
    - 支持自定义包名、Java 版本（17/21）与服务端口
  category: 后端服务
  tags:
    - Java
    - Spring Boot
    - 微服务
    - Maven
  version: 1.0.0
  gitUrl: https://github.com/agilebuilder/template-java-spring-boot-service.git
  defaultBranch: main
  englishMetadata:
    name: Spring Boot service
    summary: Spring Boot 3.3.x and Maven service with consistent responses and
      exception handling.
    description: A layered Java service starter with Bean Validation, consistent API
      responses, exception handling and controller tests. The example item
      repository uses in-memory storage; replace it when persistent storage is
      required.
    category: Backend services
    tags:
      - Java
      - Spring Boot
      - Maven
      - Microservices
